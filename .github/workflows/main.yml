name: OrangeFox - Builder

on:
  workflow_dispatch:
    inputs:
      DEVICE_TREE:
        description: 'Device Tree Link'
        required: true
        default: 'https://github.com'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'Device Tree Path'
        required: true
        default: 'device/oukitel/WP19_Pro'
      DEVICE_NAME:
        description: 'Device Codename'
        required: true
        default: 'WP19_Pro'
      BUILD_TARGET:
        description: 'Build Target (recovery, boot, or vendorboot)'
        required: true
        default: 'recovery'

jobs:
  build:
    name: Building Orangefox Recovery
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: OrangeFox Build
        uses: UWU-TEAM/UWU-OrangeFox-Builder@v1.0.0
        with:
          USER_NAME: 'idongpword'
          USER_EMAIL: 'your_email@example.com'
          DEVICE_TREE: ${{ github.event.inputs.DEVICE_TREE }}
          DEVICE_TREE_BRANCH: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
          DEVICE_PATH: ${{ github.event.inputs.DEVICE_PATH }}
          DEVICE_NAME: ${{ github.event.inputs.DEVICE_NAME }}
          BUILD_TARGET: ${{ github.event.inputs.BUILD_TARGET }}
          GH_RELEASE: 'true'
